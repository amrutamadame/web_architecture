<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Hogwarts House Generator</title>
  </head>
  <body>
    <marquee class="outlined">
      Let the Sorting Hat choose your Hogwarts House!
    </marquee>

    <h1>Welcome to Hogwarts!</h1>
    <p>Enter your name to discover which Hogwarts House you belong to!</p>

    <input type="text" id="nameInput" placeholder="Enter your name" />
    <button id="generateButton">Generate House</button>
    <button id="tryAgain">Try New House</button>
    <div id="result"></div>
    <div id="result2"></div>

    <script src="script.js"></script>
  </body>
</html>
